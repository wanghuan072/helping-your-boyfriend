name: Production IndexNow differential notification
on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.promoted]
  workflow_dispatch:
    inputs:
      project_id:
        description: Configured Vercel project ID
        required: true
        type: string
      deployment_id:
        description: Current successful production deployment ID
        required: true
        type: string
      bootstrap:
        description: Explicit initial/migration bootstrap (submits all current URLs)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: indexnow-${{ vars.VERCEL_PROJECT_ID }}-production
  cancel-in-progress: false
  queue: max
env:
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
  SITE_URL: ${{ vars.SITE_URL }}
jobs:
  filter:
    if: vars.INDEXNOW_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.event.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: event
        run: node scripts/seo/workflow.mjs filter
  verify:
    needs: filter
    if: needs.filter.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.deployment.outputs.verified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: deployment
        run: node scripts/seo/workflow.mjs verify
        env:
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
  submit:
    needs: verify
    if: needs.verify.outputs.verified == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: node scripts/seo/workflow.mjs submit
        env:
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_CHECKPOINT_URL: ${{ vars.INDEXNOW_CHECKPOINT_URL }}
          INDEXNOW_CHECKPOINT_TOKEN: ${{ secrets.INDEXNOW_CHECKPOINT_TOKEN }}
